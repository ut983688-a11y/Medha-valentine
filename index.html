<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Ayushi ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    margin: 0;
    height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  .card {
    background: rgba(255,255,255,0.25);
    backdrop-filter: blur(12px);
    padding: 25px;
    border-radius: 20px;
    text-align: center;
    width: 90%;
    max-width: 420px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.25);
  }

  h1, h2 {
    color: #333;
  }

  .buttons {
    position: relative;
    height: 150px;
  }

  button {
    padding: 12px 28px;
    font-size: 16px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
  }

  #yes {
    background: #ff4d6d;
    color: white;
  }

  #no {
    background: #ddd;
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
  }

  .slideshow img {
    width: 100%;
    border-radius: 15px;
    margin-top: 15px;
    display: none;
  }

  .heart {
    position: fixed;
    font-size: 22px;
    animation: floatUp 3s linear forwards;
  }

  @keyframes floatUp {
    from { transform: translateY(0); opacity: 1; }
    to { transform: translateY(-100vh); opacity: 0; }
  }
</style>
</head>

<body>

<div class="card" id="card">
  <h1>Ayushi 💖<br>Will you be my Valentine?</h1>

  <p id="countdown"></p>

  <div class="buttons">
    <button id="yes">YES 😍</button>
    <button id="no">NO 🙈</button>
  </div>
</div>

<audio id="music" src="music.mp3"></audio>

<script>
  const noBtn = document.getElementById("no");
  const yesBtn = document.getElementById("yes");
  const card = document.getElementById("card");
  const music = document.getElementById("music");

  // NO button movement (desktop + mobile)
  function moveNo() {
    const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
    const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
    noBtn.style.position = "fixed";
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
  }

  noBtn.addEventListener("mouseover", moveNo);
  noBtn.addEventListener("touchstart", moveNo);

  // YES click
  yesBtn.addEventListener("click", () => {
    music.play();

    card.innerHTML = `
      <h2>Yayyyy 🥰</h2>
      <p>
        Ayushi, tumne YES bol diya ❤️<br><br>
        Ab officially:
        <br>🤍 Tum meri Valentine ho
        <br>🤗 Unlimited hugs
        <br>🍕 Meri plate se khana allowed
        <br>😂 Meri bakwaas jokes compulsory
        <br><br>
        I love you endlessly 💖
      </p>

      <div class="slideshow">
        <img src="photo1.jpg">
        <img src="photo2.jpg">
        <img src="photo3.jpg">
      </div>
    `;

    startSlideshow();
    launchHearts();

    setTimeout(() => {
      window.location.href =
        "https://wa.me/?text=Yes%20I%20will%20be%20your%20Valentine%20forever%20❤️🥰%20I%20love%20you";
    }, 4000);
  });

  // Hearts
  function launchHearts() {
    for (let i = 0; i < 30; i++) {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = "❤️";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.bottom = "0";
      heart.style.animationDuration = 2 + Math.random() * 2 + "s";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 4000);
    }
  }

  // Slideshow
  function startSlideshow() {
    let index = 0;
    const images = document.querySelectorAll(".slideshow img");
    images[0].style.display = "block";

    setInterval(() => {
      images[index].style.display = "none";
      index = (index + 1) % images.length;
      images[index].style.display = "block";
    }, 2000);
  }

  // Valentine countdown (14 Feb)
  const countdownEl = document.getElementById("countdown");
  const valentineDate = new Date(new Date().getFullYear(), 1, 14);

  setInterval(() => {
    const now = new Date();
    const diff = valentineDate - now;

    if (diff > 0) {
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      countdownEl.innerHTML = `💝 Valentine in ${days} days ${hours} hrs`;
    } else {
      countdownEl.innerHTML = "💘 Happy Valentine’s Day!";
    }
  }, 1000);
</script>

</body>
</html>
